# Render Blueprint: one Docker web service + one managed Postgres.
# Dashboard -> New -> Blueprint -> pick this repository. Render builds the root
# Dockerfile, injects DATABASE_URL from the database, generates JWT_SECRET, and the
# container runs `alembic upgrade head` before starting.
services:
  - type: web
    name: ledger
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ledger-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: LOG_LEVEL
        value: INFO

databases:
  - name: ledger-db
    plan: free
    databaseName: ledger
    user: ledger
